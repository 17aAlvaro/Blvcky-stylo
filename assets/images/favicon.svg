<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#161616"/>
      <stop offset="60%" stop-color="#080808"/>
      <stop offset="100%" stop-color="#020202"/>
    </radialGradient>

    <!-- Ultra Luxury Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff6cc"/>
      <stop offset="25%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="80%" stop-color="#aa831e"/>
      <stop offset="100%" stop-color="#73540d"/>
    </linearGradient>

    <!-- Chrome White Glow Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#d4af37" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Base Dark Squircle (Rounded Canvas) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)"/>

  <!-- Outer Luxury Gold Border -->
  <rect x="22" y="22" width="468" height="468" rx="106" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-opacity="0.9"/>
  <rect x="36" y="36" width="440" height="440" rx="94" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Golden 5-Point Crown on Top -->
  <g filter="url(#goldGlow)" transform="translate(256, 118)">
    <path d="M -72 32 L -96 -16 L -36 4 L 0 -36 L 36 4 L 96 -16 L 72 32 Z" fill="url(#goldGrad)"/>
    <!-- Jewels on Crown -->
    <circle cx="-96" cy="-20" r="6" fill="#fff9db"/>
    <circle cx="0" cy="-42" r="7.5" fill="#fff9db"/>
    <circle cx="96" cy="-20" r="6" fill="#fff9db"/>
    <circle cx="-36" cy="2" r="4.5" fill="#fff9db"/>
    <circle cx="36" cy="2" r="4.5" fill="#fff9db"/>
  </g>

  <!-- Monogram 'B' (Iconic Barber Razor Cut Style) -->
  <g filter="url(#goldGlow)">
    <!-- Main Architectural 'B' Body -->
    <path d="
      M 160 175
      L 278 175
      C 324 175, 356 195, 356 235
      C 356 262, 338 282, 310 293
      C 346 304, 368 328, 368 368
      C 368 414, 330 437, 276 437
      L 160 437
      Z
      M 218 221
      L 218 282
      L 268 282
      C 288 282, 302 272, 302 252
      C 302 231, 288 221, 268 221
      Z
      M 218 330
      L 218 391
      L 272 391
      C 294 391, 310 380, 310 360
      C 310 341, 294 330, 272 330
      Z
    " fill="url(#goldGrad)"/>

    <!-- Sharp Barber Razor Fade Slash (Negative Space Cut across the waist) -->
    <polygon points="140,314 380,270 382,284 140,328" fill="#080808"/>
    <!-- Blade Sheen Edge inside the Slash -->
    <line x1="145" y1="316" x2="378" y2="272" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Tiny Corner Spark / Diamond Glint -->
  <g transform="translate(365, 175)">
    <path d="M 0 -14 Q 0 0 14 0 Q 0 0 0 14 Q 0 0 -14 0 Q 0 0 0 -14 Z" fill="#ffffff" opacity="0.95"/>
  </g>
</svg>

